name: preview deployment

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-deployment-main
  cancel-in-progress: true

jobs:
  deploy:
    # Do not make the deployment key available to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_DIRECTORY: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && 'main' || 'preview' }}"
      PREVIEW_LABEL: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.event_name == 'push' && 'main' || 'manual preview' }}"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Create the PREVIEW_DEPLOY_KEY repository secret after adding the deploy key.
      - name: Check out deployment repository
        uses: actions/checkout@v6
        with:
          repository: open-abap/open-abap-gui-preview-deployments
          ref: main
          path: deployment
          ssh-key: ${{ secrets.PREVIEW_DEPLOY_KEY }}

      - run: npm run web:build

      - name: Push preview deployment
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/deployment"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf -- "$PREVIEW_DIRECTORY"
          mkdir -p -- "$PREVIEW_DIRECTORY"
          cp -R "$GITHUB_WORKSPACE/build/." "$PREVIEW_DIRECTORY/"
          git add --all

          if git diff --cached --quiet; then
            echo "Preview is unchanged"
          else
            git commit -m "Deploy $PREVIEW_LABEL"
            git push origin HEAD:main
          fi

      - name: Add or update preview comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: https://open-abap.github.io/open-abap-gui-preview-deployments/pr-${{ github.event.pull_request.number }}/
          VISUAL_DIFF_URL: https://open-abap.github.io/open-abap-gui-preview-deployments/pr-${{ github.event.pull_request.number }}/visual-diffs/
        run: |
          set -euo pipefail

          marker='<!-- open-abap-gui-preview-deployment -->'
          short_sha="${GITHUB_SHA:0:7}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf '%s\n\nPreview deployment: [Open preview](%s) · [Visual screenshot diffs](%s)\n\nBuilt from [`%s`](%s) · [Workflow run](%s)' \
            "$marker" \
            "$PREVIEW_URL" \
            "$VISUAL_DIFF_URL" \
            "$short_sha" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
            "$run_url")

          comments=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100")
          comment_id=$(jq -r --arg marker "$marker" \
            '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains($marker)))][0].id // empty' \
            <<<"$comments")

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -f body="$body" >/dev/null
            echo "Updated preview comment $comment_id"
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$body" >/dev/null
            echo "Created preview comment"
          fi
