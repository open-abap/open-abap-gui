name: regression

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abapgit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
    - run: node .github/regression/run.js
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: regression-logs
        path: regression-work/*.log
        retention-days: 7
